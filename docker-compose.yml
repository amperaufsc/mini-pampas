# Base config, OS-neutral. Combine with ONE display override:
#   compose.x11.yml      Linux on X11 (also works on Wayland via XWayland)
#   compose.wayland.yml  Linux on Wayland
#   compose.wsl.yml      Windows via WSL2 + WSLg
services:
  mini-pampas:
    image: mini-pampas:latest
    container_name: mini-pampas
    stdin_open: true
    tty: true
    privileged: true

    build:
      context: .

    ports:
      - "8765:8765"   # Foxglove Bridge WebSocket port

    environment:
      - ROS_DOMAIN_ID=67
      - TERM=${TERM:-xterm-256color}
      - COLORTERM=truecolor

    volumes:
      - .:/mini_pampas   # matches WORKDIR in the Dockerfile
      - /dev:/dev        # pass USB devices (LiDAR) dynamically into the container

    develop:
      watch:
        # Automatically rebuild on updates to these files
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock